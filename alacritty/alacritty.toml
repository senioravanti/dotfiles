[font]
size = 14.0

[font.bold]
family = "JetBrainsMono NFM"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono NFM"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono NFM"
style = "Italic"

[font.normal]
family = "JetBrainsMono NFM"
style = "Regular"

[general]
import = [
  "~/.config/alacritty/themes/themes/catppuccin_mocha.toml"
]

[terminal]
shell = { program = "/usr/bin/zsh", args = [ "-l", "-c", "zellij" ] }
